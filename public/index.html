<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cash Flow Tracker</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23208AEC'/%3E%3Cpath d='M9 21l5-6 4 3 5-8' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside class="sidebar">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M9 21l5-6 4 3 5-8" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Cash Flow</span>
  </div>
  <div class="demo-banner" id="demoBanner" hidden>Demo data — resets nightly</div>
  <nav aria-label="Sections" id="nav" hidden>
    <a href="#/transactions" data-route="transactions">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h12m0 0l-3-3m3 3l-3 3M17 17H5m0 0l3-3m-3 3l3 3"/></svg>
      Transactions
    </a>
    <a href="#/report" data-route="report">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v16h16M9 16v-5m4 5V8m4 8v-3"/></svg>
      Report
    </a>
    <a href="#/settings" data-route="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10m4 0h2M4 17h2m4 0h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      Accounts &amp; categories
    </a>
  </nav>
  <div class="sidebar-footer" id="who" hidden>
    <p><span id="whoName"></span><br><small id="whoRole"></small></p>
    <button class="btn subtle" id="signOut">Sign out</button>
  </div>
</aside>

<main id="app" tabindex="-1"></main>

<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>
<dialog id="dlgConfirm" aria-labelledby="confirmTitle"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<div id="tip" hidden></div>

<script src="/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/parse@8.6.2/dist/parse.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
